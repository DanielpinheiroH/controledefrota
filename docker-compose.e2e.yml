services:
  backend:
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-frotagest}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-frotagest}?options=-csearch_path%3De2e
      ALLOWED_ORIGINS: http://localhost:8089,http://127.0.0.1:8089
    volumes:
      - e2e_uploads:/app/uploads
  frontend:
    ports: !override
      - "127.0.0.1:8089:80"
volumes:
  e2e_uploads:
