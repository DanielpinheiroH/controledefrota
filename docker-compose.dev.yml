services:
  postgres:
    ports:
      - "127.0.0.1:5433:5432"
  backend:
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:8088,http://127.0.0.1:8088
    volumes:
      - ./backend:/app
    command: sh -c 'alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload'
