server {
    listen 80;
    listen [::]:80;
    server_name frotasguest.duckdns.org;
    access_log /opt/frotasguest/logs/access.log;
    error_log /opt/frotasguest/logs/error.log;
    location ^~ /.well-known/acme-challenge/ { root /opt/frotasguest/acme; }
    location / { return 301 https://frotasguest.duckdns.org$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name frotasguest.duckdns.org;
    ssl_certificate /opt/frotasguest/certificates/live/frotasguest.duckdns.org/fullchain.pem;
    ssl_certificate_key /opt/frotasguest/certificates/live/frotasguest.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 11m;
    access_log /opt/frotasguest/logs/access.log;
    error_log /opt/frotasguest/logs/error.log;
    location / {
        proxy_pass http://127.0.0.1:8060;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
